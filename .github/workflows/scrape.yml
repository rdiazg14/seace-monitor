name: Scrape SEACE contrataciones menores

on:
  schedule:
    # 11:00 UTC diario = 06:00 hora Peru (UTC-5)
    - cron: "0 11 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: scrape-seace
  cancel-in-progress: false

jobs:
  scrape:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install playwright pandas pyarrow supabase
          playwright install --with-deps chromium

      # ── Vista filtrada: "token" (rápida, 10-20 registros) ──────────────
      - name: Scraper filtrado (token + Servicio)
        run: |
          python scraper_seace_menores.py \
            --keyword token \
            --objeto Servicio \
            --out data/contratos_token.csv

      # ── Ingesta incremental: corpus completo → Supabase + parquet/CSV ──
      - name: Ingesta incremental corpus completo
        env:
          SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          python ingesta_completa.py

      - name: Marcar fecha de corrida
        run: |
          date -u '+%Y-%m-%d %H:%M:%S UTC' > data/ultima_corrida.txt
          echo "=== ultima_corrida.txt ==="; cat data/ultima_corrida.txt
          echo "=== ultima_ingesta.txt ==="; cat data/ultima_ingesta.txt

      - name: Commit y push de data/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then
            echo "Sin cambios en data/; nada que commitear."
          else
            TOTAL=$(grep total_registros data/ultima_ingesta.txt | cut -d= -f2)
            NUEVOS=$(grep nuevos_esta_corrida data/ultima_ingesta.txt | cut -d= -f2)
            git commit -m "chore(data): SEACE $(date -u '+%Y-%m-%d') — corpus=${TOTAL} nuevos=${NUEVOS}"
            git push
          fi
