# DEPRECATED: el diario es pipeline.yml (09:00 Perú).
# Este workflow NO hace ingesta/G1/PDF/OCR/embed. No llama a BGE.
# Solo queda lo que el pipeline no tiene: snapshot token CSV + prueba G3.
name: "[DEPRECATED] Scrape SEACE (token CSV / prueba G3)"

on:
  workflow_dispatch:
    inputs:
      simular_alerta:
        description: "G3: no scrapea; abre un issue de prueba"
        type: boolean
        default: false

permissions:
  issues: write
  contents: read

concurrency:
  group: scrape-seace
  cancel-in-progress: false

jobs:
  token_csv:
    if: ${{ github.event.inputs.simular_alerta != 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      issues: write
      contents: write
    env:
      PYTHONUNBUFFERED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Scraper filtrado (token + Servicio)
        run: |
          python scraper_seace_menores.py \
            --keyword token \
            --objeto Servicio \
            --out data/contratos_token.csv

      - name: Commit y push de data/
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/contratos_token.csv
          if git diff --cached --quiet; then
            echo "Sin cambios en contratos_token.csv"
          else
            git commit -m "chore(data): snapshot token CSV $(date -u '+%Y-%m-%d')"
            git push
          fi

  alerta_prueba:
    if: ${{ github.event.inputs.simular_alerta == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      issues: write
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Disparo de prueba G3
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python alerta_g3.py --simular
