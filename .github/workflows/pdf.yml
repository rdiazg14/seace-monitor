# Primera prueba real de PDF/TDR. Manual. NO está en el cron diario.
name: Descargar requerimientos PDF

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "Contratos vigentes a procesar (pdf_descargado=false)"
        required: false
        default: "20"

permissions:
  issues: write
  contents: read

concurrency:
  group: pdf-tdr
  cancel-in-progress: false

jobs:
  pdf:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      issues: write
      contents: read
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Descargar y extraer PDF/TDR
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -z "$LIMIT" ]; then LIMIT=20; fi
          python descargar_requerimiento.py --limit "$LIMIT"

      - name: Alerta G3
        if: always() && !cancelled()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python alerta_g3.py --job-status ${{ job.status }}
