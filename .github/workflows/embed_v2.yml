# One-shot / re-runnable: llena embedding_v2 de vigentes (WHERE NULL).
# No reemplaza el cron BGE. No hace --rechunk.
name: Embeddings Gemini v2

on:
  workflow_dispatch:
    inputs:
      limit:
        description: "0 = todos los chunks vigentes con embedding_v2 NULL"
        required: false
        default: "0"

permissions:
  contents: read

concurrency:
  group: embed-gemini-v2
  cancel-in-progress: false

jobs:
  embed:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL:         ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GEMINI_API_KEY:       ${{ secrets.GEMINI_API_KEY }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias mínimas
        run: |
          python -m pip install --upgrade pip
          pip install "supabase>=2.0" "httpx>=0.27"

      - name: Embeddings gemini-embedding-001 @1536
        run: |
          LIMIT="${{ github.event.inputs.limit }}"
          if [ -z "$LIMIT" ] || [ "$LIMIT" = "0" ]; then
            python generar_embeddings.py --backend gemini
          else
            python generar_embeddings.py --backend gemini --limit "$LIMIT"
          fi
