name: CI (tests)

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v5

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
          python-version: "3.12"

      - name: Install dependencies
        run: uv sync --frozen

      # Los workflows productivos instalan con `pip -r requirements.txt`;
      # este paso impide que ese espejo manual se desvíe de pyproject.
      - name: Verify requirements.txt mirrors pyproject dependencies
        run: |
          uv run python - <<'PY'
          import pathlib, re, tomllib
          deps = tomllib.loads(
              pathlib.Path("pyproject.toml").read_text()
          )["project"]["dependencies"]
          norm = lambda lines: sorted(
              re.sub(r"\s+", "", l).lower()
              for l in lines if l.strip() and not l.lstrip().startswith("#")
          )
          req = norm(pathlib.Path("requirements.txt").read_text().splitlines())
          assert norm(deps) == req, (
              "requirements.txt diverge de pyproject.dependencies\n"
              f"pyproject: {norm(deps)}\nrequirements: {req}"
          )
          PY

      - name: Run tests
        run: uv run pytest -q
