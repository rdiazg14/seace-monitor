# Deteccion temprana (B12). El pipeline diario dura ~49 min, de los cuales
# G1 (refresh_estados) son ~40. La ingesta incremental son 13 s.
# SEACE publica y abre la ventana casi al mismo tiempo (mediana 25 min),
# asi que no hay nada que anticipar: hay que mirar mas seguido.
# De 445 contratos IT en 60 dias, 78 (17.5%) tuvieron una ventana que ningun
# disparo de las 14:00 UTC alcanzo. Los 78 tienen todo lo que Ruta del dia
# necesita para rankear (categoria_it por keywords + estado de la ingesta);
# no necesitan TDR ni embeddings para aparecer.
# Además de altas + detalle, corre refresh de estado acotado (postulables/
# por abrir TI/IA), OCR (páginas imagen, mismo tope del diario) y análisis IA
# de postulables nuevos: así un contrato nuevo TI queda analizado y con estado
# fresco en ~2h en vez de esperar al diario de las 09:00.
# Este workflow NO commitea data/: el parquet/CSV lo mantiene el diario.
# La fuente de verdad es Supabase (BD + Storage); el contador de cuota Flash
# vive en la tabla pipeline_cuota_ocr, compartida con el diario.
name: Deteccion temprana (altas + detalle)

on:
  workflow_dispatch:
  schedule:
    # Cada 2h UTC, salvo las 14:00 UTC (09:00 Lima) que coincide con el diario:
    # ahí el pipeline completo ya corre OCR + análisis y no queremos solapar.
    - cron: "0 0,2,4,6,8,10,12,16,18,20,22 * * *"

permissions:
  issues: write
  contents: read

# Grupo propio, distinto de scrape-seace. No compite con el diario porque no
# toca git ni corre G1; el grupo propio evita que dos livianos se solapen entre si.
concurrency:
  group: deteccion-temprana
  cancel-in-progress: false

jobs:
  deteccion:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      issues: write
      contents: read
    env:
      PYTHONUNBUFFERED: "1"
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      FUNNEL_TOKEN: ${{ secrets.FUNNEL_TOKEN }}
      ANALIZAR_SERVICE_TOKEN: ${{ secrets.ANALIZAR_SERVICE_TOKEN }}
      DATABASE_URL: ${{ secrets.DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Configurar Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          playwright install --with-deps chromium

      - name: Ingesta incremental
        id: ingesta
        continue-on-error: true
        run: python ingesta_completa.py

      - name: Marcar ingesta
        if: ${{ always() && !cancelled() && steps.ingesta.outcome == 'success' }}
        continue-on-error: true
        run: python marcar_ingesta.py

      - name: Detalle web
        id: detalle
        continue-on-error: true
        run: python enriquecer_detalle.py --limit 150

      # Espejo de items_json -> contrato_items (idempotente). El diario lo corre
      # tras enriquecer_detalle; acá también porque "Detalle web" (--limit 150)
      # enriquece items_json cada 2h y sin este paso el desync crece hasta la
      # próxima corrida diaria (medido: 323 Vigentes desync).
      - name: Sincronizar contrato_items
        id: items
        if: ${{ success() && steps.detalle.outcome == 'success' }}
        continue-on-error: true
        run: python sincronizar_items.py

      # Refresco acotado de estado: solo Vigentes IT/IA postulables o por abrir
      # (~15-40), no los ~1900 del diario. Rápido (segundos), para que un
      # contrato que SEACE ya cerró no siga apareciendo postulable entre diarios.
      - name: Refresco de estados (acotado)
        id: g1
        if: ${{ success() && steps.detalle.outcome == 'success' }}
        continue-on-error: true
        run: python refresh_estados.py --solo-postulables

      # 65% de los contratos IT abren ventana en <2h (mediana 21 min). Sin
      # este paso el PDF esperaba al diario de las 09:00: hasta 15h visible
      # sin analizar. --limit 40 es tope de seguridad; el resto lo hace el
      # diario. PyMuPDF no gasta Flash; el OCR (Flash) viene después, solo
      # para las páginas imagen que este paso marca como pendientes.
      - name: PDF nativo (PyMuPDF, sin Flash)
        id: pdf
        if: ${{ success() && steps.detalle.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 8
        run: python descargar_requerimiento.py --solo-nativo --limit 40

      # Mismo flujo OCR del diario, tras el nativo: PyMuPDF ya extrajo el texto
      # de los PDFs de texto; el OCR (Flash) solo procesa las páginas imagen
      # pendientes. Mismas reglas/topes del diario (--max-segundos 7200,
      # --rpm 6, --max-ocr-dia 6000). La cola acá es chica (contratos nuevos TI),
      # así que termina rápido pese al reloj de 2 h.
      - name: OCR selectivo (TI, incl. por-abrir, páginas imagen)
        id: ocr
        if: ${{ success() && steps.pdf.outcome == 'success' }}
        continue-on-error: true
        timeout-minutes: 30
        run: python descargar_requerimiento.py --solo-ocr --solo-ti --incluir-por-abrir \
          --max-segundos 7200 --rpm 6 --max-ocr-dia 6000 --limit 0

      # Análisis IA de postulables y por-abrir (mismo script y flag del diario).
      # Idempotente: solo procesa contratos sin fila previa con el mismo pdf_hash.
      # Con el TDR recién extraído (nativo + OCR) ya puede analizar, incluidos los
      # por-abrir, sin esperar al diario de las 09:00.
      - name: Analizar postulables y por-abrir (anticipado)
        id: analizar
        if: ${{ !cancelled() }}
        continue-on-error: true
        timeout-minutes: 15
        run: python scripts/analizar_postulables.py --limit 25

      - name: G3 deteccion_ingesta
        if: ${{ always() && !cancelled() && steps.ingesta.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python alerta_g3.py --paso deteccion_ingesta --job-status failure

      - name: G3 deteccion_detalle
        if: ${{ always() && !cancelled() && steps.detalle.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python alerta_g3.py --paso deteccion_detalle --job-status failure

      - name: G3 deteccion_g1
        if: ${{ always() && !cancelled() && steps.g1.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python alerta_g3.py --paso deteccion_g1 --job-status failure

      - name: G3 deteccion_pdf
        if: ${{ always() && !cancelled() && steps.pdf.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python alerta_g3.py --paso deteccion_pdf --job-status failure

      - name: G3 deteccion_ocr
        if: ${{ always() && !cancelled() && steps.ocr.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python alerta_g3.py --paso deteccion_ocr --job-status failure

      - name: G3 deteccion_analizar
        if: ${{ always() && !cancelled() && steps.analizar.outcome == 'failure' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python alerta_g3.py --paso deteccion_analizar --job-status failure
